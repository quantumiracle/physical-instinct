const FOOT_ZH=`<h2>分类说明</h2><ul>
<li><b>真机遥操作</b>：人通过主从臂、VR 或手机遥控真实机器人采集的示教数据（ALOHA、DROID、AgiBot World 等）。</li>
<li><b>真机自主/play</b>：机器人自主探索、随机动作、自监督抓取，或策略部署与人在环纠正产生的数据（QT-Opt、RoboNet 等）。</li>
<li><b>手持夹爪（UMI）</b>：人手持与机器人末端一致的夹爪/相机采集，再部署到机械臂上（UMI、FastUMI 等）。</li>
<li><b>人类第一人称视频</b>：头戴相机或眼镜拍摄的人类日常/劳动视频，常带手部姿态，用于表征、世界模型和人-机迁移（Ego4D、EgoDex 等）。</li>
<li><b>手物交互/灵巧</b>：用动捕、多视角或可穿戴设备记录的人手-物体交互，服务灵巧手抓取与重定向（DexYCB、ARCTIC、OakInk 等）。</li>
<li><b>人体动捕（人形）</b>：全身人体运动数据及其到人形机器人的重定向版本，用于全身跟踪与运动控制（AMASS、LAFAN1、PHUMA 等）。</li>
<li><b>仿真/合成</b>：在仿真器中由人遥操作、脚本或自动生成（MimicGen 等）的轨迹，以及合成抓取库（RoboCasa、GR00T Sim、InternData-A1 等）。</li>
<li><b>聚合集合</b>：把多个已有数据集统一格式后打包的集合（OXE、ARIO、UniACT 等）。为避免重复计算，顶部条数和时长合计不含这一类。</li></ul>
<h2>说明</h2><ul>
<li>“条数”是数据集自己的计数单位：轨迹、示教、视频片段、动作序列，抓取库则是抓取数，不同类型之间不可直接相加比较。顶部合计只统计可公开下载的数据，并排除聚合集合（避免重复）和抓取库（单位是抓取），只是粗略量级，随筛选变化。</li>
<li>“≈”表示约数、论文的“超过 X”，或只在二手来源中出现的数字。未知的留空（—）。日期为首次公开（论文或数据发布）的年月。</li>
<li>“可公开下载”指任何人可按公开许可获取（含 CC BY-NC 等非商用许可和需同意条款的 gated 仓库）；π 数据、GEN-0 这类只作规模参考的闭源数据标为“未公开”。</li>
<li>OXE 收录的子集（Fractal、Bridge、Kuka、TACO-Play、Jaco Play 等）同时单独列出。π、GEN-0 的时长来自公司自述。</li>
<li>蓝色标签链接到硬件图谱中对应的机器人或采集设备；人类数据集的“本体”是采集设备。</li>
<li>没有收录：未公开数据的公司（如自变量机器人 Wall-OSS 只开源了模型）、自动驾驶数据，以及大量规模很小的单任务数据集。</li></ul>
<h2>数据来源</h2><ul>
<li>各数据集的论文（arXiv、RSS、CoRL、CVPR、ICLR、ICML）与项目主页，每行“论文/主页/下载”链接即出处</li>
<li>Hugging Face 数据卡与 API（创建时间、许可、条数），如 AgiBot World、NVIDIA Physical AI、LeRobot 社区数据、BEHAVIOR Challenge</li>

<p>数据下载：<a href="data/datasets.json">datasets.json</a> · <a href="data/datasets.csv">datasets.csv</a> · 源码：<a href="https://github.com/quantumiracle/physical-instinct">github.com/quantumiracle/physical-instinct</a></p>`;
const FOOT_EN=`<h2>Types</h2><ul>
<li><b>Real-robot teleop</b>: demonstrations collected by people driving real robots through leader arms, VR or phones (ALOHA, DROID, AgiBot World…).</li>
<li><b>Real-robot autonomous / play</b>: data from autonomous exploration, random actions, self-supervised grasping, or policy rollouts with human-in-the-loop corrections (QT-Opt, RoboNet…).</li>
<li><b>Handheld gripper (UMI)</b>: people carry a gripper/camera that matches the robot's end-effector, and policies are deployed on arms afterwards (UMI, FastUMI…).</li>
<li><b>Human egocentric video</b>: head-mounted camera or glasses footage of daily life or labour, often with hand pose; used for representations, world models and human-to-robot transfer (Ego4D, EgoDex…).</li>
<li><b>Hand-object / dexterous</b>: hand–object interaction captured with mocap, multi-view rigs or wearables, for dexterous grasping and retargeting (DexYCB, ARCTIC, OakInk…).</li>
<li><b>Human mocap (humanoid)</b>: whole-body human motion and its retargeted humanoid versions, for whole-body tracking and locomotion (AMASS, LAFAN1, PHUMA…).</li>
<li><b>Simulation / synthetic</b>: trajectories teleoperated, scripted or auto-generated (e.g. MimicGen) in simulators, plus synthetic grasp libraries (RoboCasa, GR00T Sim, InternData-A1…).</li>
<li><b>Aggregated collection</b>: bundles of existing datasets converted to one format (OXE, ARIO, UniACT…). They are left out of the episode and hour totals at the top to avoid double counting.</li></ul>
<h2>Notes</h2><ul>
<li>“Episodes” uses each dataset's own unit: trajectories, demos, video clips, motion sequences, or grasps for grasp libraries. They are not comparable across types. The totals at the top count openly downloadable data only and leave out aggregated collections (double counting) and grasp libraries (counted in grasps); they are a rough order of magnitude and follow the filters.</li>
<li>“≈” marks approximate figures, “over X” claims, or numbers found only in second-hand sources. Unknown values are left blank (—). Dates are the month of first public release (paper or data).</li>
<li>“Openly downloadable” means anyone can obtain the data under a public licence (including non-commercial CC licences and gated repos with click-through terms). Closed corpora such as the π dataset and GEN-0 are listed for scale only and marked “Not released”.</li>
<li>OXE constituents (Fractal, Bridge, Kuka, TACO-Play, Jaco Play…) are also listed on their own. π and GEN-0 hours are company claims.</li>
<li>Blue tags link to the matching robot or capture device in the hardware atlas; for human datasets the “embodiment” is the capture device.</li>
<li>Not included: companies that have not opened their data (e.g. X Square Robot open-sourced the Wall-OSS model only), driving datasets, and the long tail of small single-task datasets.</li></ul>
<h2>Sources</h2><ul>
<li>Each dataset's paper (arXiv, RSS, CoRL, CVPR, ICLR, ICML) and project page; the Paper / Site / Download links on every row are the sources</li>
<li>Hugging Face dataset cards and API (creation date, licence, counts), e.g. AgiBot World, NVIDIA Physical AI, the LeRobot community dataset, BEHAVIOR Challenge</li>
<li>2026 releases: AgiBot's AGIBOT WORLD 2026 announcements, coverage of Lightwheel's EgoSuite-Open100K and PsiBot's Psi-R2, DEEP Robotics' LynxScenes press release, QbitAI on NeoData</li></ul>
<p>Download: <a href="data/datasets.json">datasets.json</a> · <a href="data/datasets.csv">datasets.csv</a> · Source: <a href="https://github.com/quantumiracle/physical-instinct">github.com/quantumiracle/physical-instinct</a></p>`;

let LANG="zh", D=[];
const tx=k=>T[LANG][k];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"";
const dash='<span class="dim">—</span>';
function fmt(n){
  if(n==null)return "";
  if(LANG==="zh"){
    if(n>=1e8)return +(n/1e8).toFixed(n>=1e9?0:1)+" 亿";
    if(n>=1e4)return +(n/1e4).toFixed(n>=1e6?0:1)+" 万";
    return n.toLocaleString("zh-CN");
  }
  if(n>=1e9)return +(n/1e9).toFixed(1)+"B";
  if(n>=1e6)return +(n/1e6).toFixed(n>=1e7?0:1)+"M";
  if(n>=1e4)return +(n/1e3).toFixed(0)+"k";
  return n.toLocaleString("en-US");
}
const st={type:"all",country:"all",open:false,year:"all",sort:"new",q:""};
let limit=60;
const ctyL=d=>d.c==="US"?tx("c_US"):d.c==="CN"?tx("c_CN"):(LANG==="en"?(CTY_EN[d.cty]||d.cty||tx("c_OT")):(d.cty||tx("c_OT")));
const ccls=c=>c==="US"?"us":c==="CN"?"cn":"ot";
function scale(d){
  const ap=k=>d.ap.includes(k)?"≈":"";
  const out=[];
  if(d.ep!=null)out.push(`${ap("ep")}${esc(fmt(d.ep))}<span class="u">${tx(d.unit==="grasp"?"grasp":"ep")}</span>`);
  if(d.h!=null)out.push(`${ap("h")}${esc(fmt(d.h))}<span class="u">${tx("h")}</span>`);
  if(d.tb!=null)out.push(`${esc(d.tb)}<span class="u">${tx("tb")}</span>`);
  return out.length?out.join("<br>"):dash;
}
function row(d){
  const zh=LANG==="zh";
  const hw=d.hwn.length?`<div class="hw">${d.hwn.map(x=>`<a href="../robot-hardware-spectrum/?q=${encodeURIComponent(x.n)}" title="${esc(x.l)}">${esc(x.l)}</a>`).join("")}</div>`:"";
  const mods=d.mod.map(m=>`<span class="chip cat">${esc(MOD_L[LANG][m]||m)}</span>`).join("");
  const links=[["paper",d.paper],["site",d.site],["dl",d.dl]].filter(([,u])=>safeUrl(u)).filter(([k,u],i,a)=>a.findIndex(x=>x[1]===u)===i)
    .map(([k,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${tx(k)}</a>`).join("");
  const note=zh?d.note_zh:d.note;
  return `<tr>
  <td class="nm"><div class="name">${esc(d.n)}</div><div class="co">${esc(d.org)}</div>${d.zh?`<div class="zh">${esc(d.zh)}</div>`:""}<div class="chips"><span class="chip ${ccls(d.c)}">${esc(ctyL(d))}</span><span class="chip cat">${esc(TYPE_L[LANG][d.type])}</span>${d.d>="2026"?`<span class="chip nw">2026</span>`:""}${d.open?"":`<span class="chip cl">${tx("closed")}</span>`}</div>${note?`<div class="note">${esc(note)}</div>`:""}</td>
  <td class="mono" data-l="${tx("l_d")}">${esc(d.d)}</td>
  <td class="mono scale" data-l="${tx("l_s")}">${scale(d)}</td>
  <td class="spec" data-l="${tx("l_e")}">${esc(zh?d.emb_zh:d.emb)||dash}${hw}</td>
  <td data-l="${tx("l_m")}"><div class="mods">${mods||dash}</div></td>
  <td class="spec" data-l="${tx("l_t")}">${esc(zh?d.sc_zh:d.sc)||dash}</td>
  <td class="lic" data-l="${tx("l_lic")}">${esc(d.lic)||dash}</td>
  <td><div class="links">${links}</div></td></tr>`;
}
function hay(d){return [d.n,d.org,d.zh,d.emb,d.emb_zh,d.sc,d.sc_zh,d.note,d.note_zh,d.lic,TYPE_L.zh[d.type],TYPE_L.en[d.type],d.hwn.map(x=>x.l).join(" "),d.mod.map(m=>MOD_L.zh[m]+" "+MOD_L.en[m]).join(" ")].join(" ").toLowerCase();}
function list(){
  const q=st.q.trim().toLowerCase();
  let L=D.filter(d=>(st.type==="all"||d.type===st.type)&&(st.country==="all"||d.c===st.country)&&(!st.open||d.open)&&(st.year==="all"||d.d.slice(0,4)===st.year)&&(!q||d._h.includes(q)));
  const num=k=>(a,b)=>(b[k]??-1)-(a[k]??-1)||b.d.localeCompare(a.d);
  if(st.sort==="new")L.sort((a,b)=>b.d.localeCompare(a.d)||a.n.localeCompare(b.n));
  else if(st.sort==="old")L.sort((a,b)=>a.d.localeCompare(b.d)||a.n.localeCompare(b.n));
  else if(st.sort==="h")L.sort(num("h"));
  else if(st.sort==="ep")L.sort(num("ep"));
  else L.sort((a,b)=>a.n.localeCompare(b.n));
  return L;
}
function kpis(L){
  const base=L.filter(d=>d.type!=="agg"&&d.open);
  const ep=base.reduce((s,d)=>s+(d.unit==="grasp"?0:(d.ep||0)),0), h=base.reduce((s,d)=>s+(d.h||0),0);
  const real=L.filter(d=>d.type!=="sim"&&d.type!=="agg").length, sim=L.filter(d=>d.type==="sim").length, agg=L.filter(d=>d.type==="agg").length;
  const K=T[LANG].k, sub=tx("ksub");
  const v=[L.length,"≈"+fmt(ep),"≈"+fmt(Math.round(h)),real,sim,agg];
  document.getElementById("kpis").innerHTML=v.map((x,i)=>`<div><b>${esc(x)}</b>${esc(K[i])}${i===1||i===2?esc(sub):""}</div>`).join("");
}
function render(){
  if(!D.length)return;
  const L=list();
  document.getElementById("rows").innerHTML=L.slice(0,limit).map(row).join("");
  document.getElementById("empty").hidden=L.length>0;
  const m=document.getElementById("more"); m.hidden=L.length<=limit; m.textContent=tx("more")(L.length-limit);
  document.getElementById("count").textContent=tx("count")(L.length,D.length);
  kpis(L);
}
function save(){try{localStorage.setItem("robot-atlas-datasets",JSON.stringify(st))}catch(e){}}
function pressed(id,v){document.querySelectorAll(`#${id} button`).forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v?"true":"false"));}
function seg(id,key){
  document.getElementById(id).addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
    st[key]=b.dataset.v;pressed(id,st[key]);limit=60;save();render();});
}
function typeButtons(){
  const el=document.getElementById("fType");
  el.innerHTML=`<button type="button" data-v="all">${esc(tx("t_all"))}</button>`+TYPES.map(t=>`<button type="button" data-v="${t}">${esc(TYPE_L[LANG][t])}</button>`).join("");
  pressed("fType",st.type);
}
function yearOpts(){
  const el=document.getElementById("fYear");
  const ys=[...new Set(D.map(d=>d.d.slice(0,4)))].sort().reverse();
  el.innerHTML=`<option value="all">${esc(tx("y_all"))}</option>`+ys.map(y=>`<option value="${y}">${y} (${D.filter(d=>d.d.startsWith(y)).length})</option>`).join("");
  el.value=ys.includes(st.year)?st.year:"all";
}
try{const s=JSON.parse(localStorage.getItem("robot-atlas-datasets")||"null");if(s&&typeof s==="object")for(const k of Object.keys(st))if(k in s&&typeof s[k]===typeof st[k])st[k]=s[k];}catch(e){}
seg("fType","type");seg("fCountry","country");
pressed("fCountry",st.country);
document.getElementById("fOpen").checked=st.open;
document.getElementById("fSort").value=st.sort;
document.getElementById("q").value=st.q;
document.getElementById("fOpen").addEventListener("change",e=>{st.open=e.target.checked;limit=60;save();render();});
document.getElementById("fYear").addEventListener("change",e=>{st.year=e.target.value;limit=60;save();render();});
document.getElementById("fSort").addEventListener("change",e=>{st.sort=e.target.value;save();render();});
document.getElementById("q").addEventListener("input",e=>{st.q=e.target.value;limit=60;save();render();});
document.getElementById("more").addEventListener("click",()=>{limit+=50;render();});
const ledeEl=document.getElementById("lede"),LEDE_ZH=ledeEl.textContent;
function setLang(l){
  LANG=l==="en"?"en":"zh";
  document.documentElement.lang=LANG==="en"?"en":"zh-CN";
  document.title=tx("doc");
  document.querySelectorAll("[data-i]").forEach(el=>{const v=T[LANG][el.dataset.i];if(typeof v==="string")el.textContent=v;});
  document.querySelectorAll("#secnav a").forEach(a=>a.textContent=a.dataset[LANG]);
  ledeEl.textContent=LANG==="en"?LEDE_EN:LEDE_ZH;
  document.getElementById("foot").innerHTML=LANG==="en"?FOOT_EN:FOOT_ZH;
  document.querySelector(".bar").setAttribute("aria-label",tx("bar"));
  document.getElementById("q").placeholder=tx("q");
  document.getElementById("fLang").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===LANG?"true":"false"));
  typeButtons();
  if(D.length)yearOpts(); else document.getElementById("fYear").innerHTML=`<option value="all">${esc(tx("y_all"))}</option>`;
  const s=document.getElementById("state"); if(s.classList.contains("err"))s.textContent=tx("err");
  render();
}
document.getElementById("fLang").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;try{localStorage.setItem("robot-atlas-lang",b.dataset.v)}catch(x){}
  try{const u=new URL(location.href);u.searchParams.set("lang",b.dataset.v);history.replaceState(null,"",u);}catch(x){}setLang(b.dataset.v);});
let L0=new URLSearchParams(location.search).get("lang");
if(L0!=="zh"&&L0!=="en"){L0=null;try{L0=localStorage.getItem("robot-atlas-lang")}catch(x){}}
if(L0!=="zh"&&L0!=="en")L0=/^zh/i.test(navigator.language||"")?"zh":"en";
setLang(L0);
fetch("data/datasets.json").then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).then(j=>{
  D=j.map(d=>Object.assign({ap:[],hw:[],hwn:[],mod:[]},d));D.forEach(d=>d._h=hay(d));
  document.getElementById("state").hidden=true;yearOpts();render();
}).catch(()=>{const s=document.getElementById("state");s.classList.add("err");s.textContent=tx("err");});
</script>
