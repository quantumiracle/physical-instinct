const isNew=d=>String(d.date)>="2025";
function row(d){
  const flag=d.c==="US"?`<span class="chip us">${tx("c_US")}</span>`:d.c==="CN"?`<span class="chip cn">${esc(d.cty?(LANG==="en"?CTY_EN[d.cty]||d.cty:d.cty):tx("c_CN"))}</span>`:`<span class="chip ot">${esc((LANG==="en"?CTY_EN[d.cty]:d.cty)||tx("c_OT"))}</span>`;
  const kind=`<span class="chip ${d.kind==="sim"?"kd":"kb"}">${tx(d.kind==="sim"?"kind_sim":"kind_bench")}</span>`;
  const stc={active:"sa",maintained:"sm",deprecated:"sd"}[d.status]||"sm";
  const chips=`<div class="chips"><span class="chip cat">${esc(typeL(d.type))}</span>${flag}<span class="chip ${stc}">${esc(tx("st")[d.status]||d.status)}</span>${isNew(d)?`<span class="chip nw">${tx("nw")}</span>`:""}</div>`;
  const zh=d.zh&&LANG==="zh"&&d.zh!==d.org?`<div class="zh">${esc(d.zh)}</div>`:(d.zh&&LANG==="en"?`<div class="zh">${esc(d.zh)}</div>`:"");
  const rel=`${esc(d.date)||dash}${d.latest?`<div class="dim">${tx("latest")}: ${esc(d.latest)}</div>`:""}`;
  const gpu=d.kind==="sim"&&d.gpu?`<div class="mono">${d.gpu==="yes"?tx("gpu_y"):tx("gpu_n")}</div>`:"";
  const lic=(d.license&&d.license!=="—"?`<div class="lic">${esc(d.license)}</div>`:"")+gpu;
  const hw=d.hw_names&&d.hw_names.length?`<div class="hw" aria-label="${tx("hwl")}">${d.hw_names.map(n=>`<a href="../robot-hardware-spectrum/?q=${encodeURIComponent(n)}" title="${tx("hwl")}: ${esc(n)}">${esc(n)}</a>`).join("")}</div>`:"";
  const tm=(d.tasks?`<div>${esc(d.tasks)}</div>`:"")+(d.metric?`<div class="dim">${tx("metric")}: ${esc(d.metric)}</div>`:"");
  const note=LANG==="en"?d.note_en:d.note_zh;
  const star=d.stars!==""&&d.stars!=null?` <span class="star" title="${esc(tx("starT")(d.stars_date))}">★ ${kfmt(d.stars)}</span>`:"";
  const L=[d.paper?`<a href="${esc(d.paper)}" target="_blank" rel="noopener">${tx("paper")}</a>`:"",d.code?`<a href="${esc(d.code)}" target="_blank" rel="noopener">${tx("code")}${star}</a>`:"",d.site?`<a href="${esc(d.site)}" target="_blank" rel="noopener">${tx("site")}</a>`:""].join("");
  return `<tr>
  <td><div class="name">${esc(d.name)}</div><div class="co">${esc(d.org)}</div>${zh}${chips}</td>
  <td class="mono" data-l="${tx("l_d")}">${rel}</td>
  <td data-l="${tx("l_l")}">${lic||dash}</td>
  <td class="rob" data-l="${tx("l_r")}">${esc(d.robots)||dash}${hw}</td>
  <td class="tm" data-l="${tx("l_t")}">${tm||dash}</td>
  <td class="note" data-l="${tx("l_note")}">${esc(note)||dash}</td>
  <td><div class="links">${L}</div></td></tr>`;
}
const TORD=[...TYPES.sim,...TYPES.bench];
function list(){
  const q=st.q.trim().toLowerCase();
  let L=D.filter(d=>(st.kind==="all"||d.kind===st.kind)&&(st.type==="all"||d.type===st.type)&&(st.country==="all"||d.c===st.country)&&(!st.act||d.status==="active")&&
    (!q||[d.name,d.org,d.zh,d.cty,CTY_EN[d.cty],d.type_zh,d.type_en,d.robots,d.tasks,d.metric,d.license,d.note_en,d.note_zh,(d.hw_names||[]).join(" "),d.latest].join(" ").toLowerCase().includes(q)));
  const dt=d=>String(d.date);
  if(st.sort==="new")L.sort((a,b)=>dt(b).localeCompare(dt(a))||a.name.localeCompare(b.name));
  else if(st.sort==="old")L.sort((a,b)=>dt(a).localeCompare(dt(b))||a.name.localeCompare(b.name));
  else if(st.sort==="type")L.sort((a,b)=>TORD.indexOf(a.type)-TORD.indexOf(b.type)||dt(a).localeCompare(dt(b)));
  else if(st.sort==="stars")L.sort((a,b)=>(+b.stars||0)-(+a.stars||0));
  return L;
}
function render(){
  if(!D.length)return;
  const L=list();
  document.getElementById("rows").innerHTML=L.map(row).join("");
  document.getElementById("empty").hidden=L.length>0;
  document.getElementById("count").textContent=tx("count")(L.length,D.length);
}
function typeSeg(){
  const el=document.getElementById("fType");
  const ts=st.kind==="all"?TORD:TYPES[st.kind];
  if(st.type!=="all"&&!ts.includes(st.type))st.type="all";
  el.innerHTML=[`<button type="button" data-v="all" aria-pressed="${st.type==="all"}">${tx("t_all")}</button>`,...ts.filter(t=>TYPE_L[t]).map(t=>`<button type="button" data-v="${t}" aria-pressed="${st.type===t}">${esc(typeL(t))}</button>`)].join("");
}
function save(){try{localStorage.setItem("robot-sim-spectrum",JSON.stringify(st))}catch(e){}}
function press(id,v){document.querySelectorAll(`#${id} button`).forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v?"true":"false"))}
function seg(id,key,after){
  const el=document.getElementById(id);
  el.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;st[key]=b.dataset.v;press(id,st[key]);if(after)after();save();render();});
}
try{const s=JSON.parse(localStorage.getItem("robot-sim-spectrum")||"null");if(s&&typeof s==="object")for(const k in st)if(k in s&&typeof s[k]===typeof st[k])st[k]=s[k];}catch(e){}
st.kind="sim";press("fCountry",st.country);
document.getElementById("fAct").checked=st.act;document.getElementById("q").value=st.q;document.getElementById("fSort").value=st.sort;
seg("fType","type");seg("fCountry","country");
document.getElementById("fAct").addEventListener("change",e=>{st.act=e.target.checked;save();render();});
document.getElementById("fSort").addEventListener("change",e=>{st.sort=e.target.value;save();render();});
document.getElementById("q").addEventListener("input",e=>{st.q=e.target.value;save();render();});
function kpis(){
  if(!D.length){document.getElementById("kpis").innerHTML="";return}
  const k=f=>D.filter(f).length;
  const V=[D.length,k(d=>d.gpu==="yes"),k(d=>d.c==="CN"),k(d=>d.c==="US"),k(d=>d.c==="OT"),k(isNew),k(d=>d.status==="deprecated")];
  document.getElementById("kpis").innerHTML=T[LANG].k.map((a,i)=>`<div><b>${V[i]}</b>${esc(a)}</div>`).join("");
}
let loadErr=false;
function setLang(l){
  LANG=l==="en"?"en":"zh";
  document.documentElement.lang=LANG==="en"?"en":"zh-CN";
  document.title=tx("doc");
  document.querySelectorAll("[data-i]").forEach(el=>{const v=T[LANG][el.dataset.i];if(typeof v==="string")el.textContent=v;});
  if(loadErr)document.getElementById("status").textContent=tx("err");
  document.querySelectorAll("#secnav a").forEach(a=>a.textContent=a.dataset[LANG]);
  document.getElementById("lede").textContent=LEDE[LANG];
  document.getElementById("foot").innerHTML=FOOT[LANG];
  document.querySelector(".bar").setAttribute("aria-label",LANG==="en"?"Filters":"筛选");
  document.getElementById("q").placeholder=tx("q");
  press("fLang",LANG);
  typeSeg();kpis();render();
}
document.getElementById("fLang").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;try{localStorage.setItem("robot-atlas-lang",b.dataset.v)}catch(x){}
  try{const u=new URL(location.href);u.searchParams.set("lang",b.dataset.v);history.replaceState(null,"",u);}catch(x){}setLang(b.dataset.v);});
let L0=new URLSearchParams(location.search).get("lang");
if(L0!=="zh"&&L0!=="en"){L0=null;try{L0=localStorage.getItem("robot-atlas-lang")}catch(x){}}
if(L0!=="zh"&&L0!=="en")L0="en";
setLang(L0);
fetch("data/sims.json").then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(j=>{
  D=Array.isArray(j)?j:[];
  D.forEach(d=>{if(!TYPE_L[d.type])TYPE_L[d.type]={zh:d.type_zh,en:d.type_en}});
  document.getElementById("status").hidden=true;
  typeSeg();kpis();render();
}).catch(()=>{loadErr=true;const s=document.getElementById("status");s.textContent=tx("err");});
</script>
</body>
</html>
